<!doctype html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B6E75">
<meta name="color-scheme" content="light dark">
<title>PaisaPulse Attendance</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Guntur:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#EDF2F3; --surface:#FFFFFF; --surface-2:#F3F7F8; --line:#D6E0E2; --ink:#0F2A33; --ink-2:#4B636B;
  --brand:#0B6E75; --brand-ink:#FFFFFF; --brand-soft:#DAEEEF;
  --ok:#1C7A4B; --ok-soft:#DDF1E5; --warn:#8F5700; --warn-soft:#FBEBC8; --bad:#B0361F; --bad-soft:#F8DED7;
  --info:#2A5DB0; --info-soft:#DCE8F8; --off:#5F767E; --off-soft:#E6ECEE;
  --shadow:0 1px 2px rgba(15,42,51,.06),0 4px 16px rgba(15,42,51,.06);
  --f-body:'Hind Guntur','Noto Sans Telugu',system-ui,sans-serif;
  --f-display:'Bricolage Grotesque','Hind Guntur',system-ui,sans-serif;
  --f-mono:'DM Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1C21; --surface:#12282F; --surface-2:#173038; --line:#25434B; --ink:#E4F0F1; --ink-2:#94AFB5;
  --brand:#4FC1C8; --brand-ink:#04282C; --brand-soft:#17424A;
  --ok:#5FD08F; --ok-soft:#143B28; --warn:#F0B44C; --warn-soft:#3F2F0F; --bad:#FF8F78; --bad-soft:#442019;
  --info:#8BAEF2; --info-soft:#1B2D50; --off:#9DB3B9; --off-soft:#1D3840; --shadow:none; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);
  padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:calc(56px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
.app{max-width:980px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h2{margin:0;text-wrap:balance} p{margin:0}
.muted{color:var(--ink-2)} .small{font-size:13px} .mono{font-family:var(--f-mono);overflow-wrap:anywhere}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;flex:none}
.mark rect{fill:var(--brand)}
.mark path{fill:none;stroke:var(--brand-ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.wm{font:700 20px/1.1 var(--f-display);letter-spacing:-.01em}
.sub{font-size:12px;color:var(--ink-2);letter-spacing:.06em;text-transform:uppercase}
.tools{display:flex;align-items:center;gap:8px;flex:none}
.role{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--brand-soft);color:var(--brand);font-weight:600}
.lang{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-weight:600;min-width:46px;min-height:36px}

.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;padding:10px 14px;font-weight:600;color:var(--ink-2)}
.tab[aria-current="page"]{color:var(--brand);border-bottom-color:var(--brand)}

#view{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.card h2{font:700 18px/1.25 var(--f-display)}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px 14px;font-weight:500}
.empty{text-align:center;align-items:center;padding:28px 18px}
.hero{gap:16px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.hero h2{font:700 26px/1.15 var(--f-display)}
.clock{font:600 38px/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stateline{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;color:var(--ink-2)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;font-weight:600;min-height:44px}
.btn.sm{min-height:36px;padding:5px 12px;font-size:14px}
.btn-primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn-out{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn-xl{min-height:68px;width:100%;font-size:20px;border-radius:16px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.danger{color:var(--bad)}

.pill{display:inline-flex;align-items:center;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.p-P{color:var(--ok);background:var(--ok-soft)} .p-L{color:var(--warn);background:var(--warn-soft)}
.p-H,.p-V{color:var(--info);background:var(--info-soft)} .p-A{color:var(--bad);background:var(--bad-soft)}
.p-W,.p-N{color:var(--off);background:var(--off-soft)}
.flag{color:var(--warn);font-size:12px;font-weight:600}

.controls{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-weight:600;font-size:14px;min-height:36px}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);align-self:flex-start}
.seg-b{border:0;background:none;padding:8px 18px;font-weight:600;min-height:40px;color:var(--ink-2)}
.seg-b[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat b{font:700 24px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink-2)}

.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.list-h{display:flex;justify-content:space-between;gap:8px;padding:10px 14px;background:var(--surface-2);font-weight:600;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 14px;min-width:0}
.row:last-child{border-bottom:0}
button.row:hover{background:var(--surface-2)}
.av{flex:none;width:38px;height:38px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700}
img.av{object-fit:cover}
.av.big{width:84px;height:84px;border-radius:16px;font-size:30px}
.who{display:flex;flex-direction:column;min-width:0;flex:1}
.who b{overflow-wrap:anywhere}
.who small{color:var(--ink-2);font-size:12.5px}
.times{font:500 13px var(--f-mono);color:var(--ink-2);white-space:nowrap}
.acts{display:flex;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.who-big{display:flex;gap:14px;align-items:center}
.photo{width:84px;height:84px;border-radius:16px;object-fit:cover}

.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table.rec{border-collapse:separate;border-spacing:0;font-size:12px;min-width:100%}
.rec th,.rec td{padding:0;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.rec th{font-weight:600;color:var(--ink-2);padding:5px 0;background:var(--surface-2);line-height:1.2}
.rec .nm{position:sticky;left:0;z-index:1;text-align:left;padding:7px 12px;min-width:140px;max-width:180px;overflow:hidden;text-overflow:ellipsis;background:var(--surface);border-right:1px solid var(--line);font-size:14px;font-weight:500}
.rec thead .nm{background:var(--surface-2);z-index:2}
.rec .wo{background:var(--off-soft)}
.cell{width:28px;height:30px;border:0;background:transparent;font:500 12px var(--f-mono);padding:0}
.c-P{color:var(--ok)} .c-L{color:var(--warn);background:var(--warn-soft)} .c-H,.c-V{color:var(--info);background:var(--info-soft)} .c-A{color:var(--bad);background:var(--bad-soft)} .c-W,.c-N{color:var(--off)}
.sum{padding:0 8px;font:500 12px var(--f-mono);min-width:40px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink-2)}
.legend i{font:500 12px var(--f-mono);font-style:normal;margin-right:5px;padding:1px 6px;border-radius:6px}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;min-height:44px;width:100%;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bset{display:flex;flex-direction:column;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.bset:last-child{border-bottom:0}
.days{display:flex;flex-wrap:wrap;gap:6px}
.days label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-weight:500;font-size:14px;background:var(--surface);color:var(--ink)}
.days input{width:auto;min-height:0}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{width:20px;height:20px;margin-top:2px;flex:none}
.err{color:var(--bad);font-weight:600}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

.scrim{position:fixed;inset:0;background:rgba(8,20,24,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{width:min(520px,100%);max-height:92%;overflow-y:auto;background:var(--surface);border-radius:18px 18px 0 0;display:flex;flex-direction:column;gap:14px;
  padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px))}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-h h2{font:700 19px/1.25 var(--f-display)}
.x{border:0;background:var(--surface-2);border-radius:50%;width:36px;height:36px;font-size:20px;line-height:1}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:18px;padding:20px}}

/* camera screen: always dark, whatever the theme */
.overlay{position:fixed;inset:0;z-index:70;background:#06151A;display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ov-box{display:flex;flex-direction:column;align-items:center;gap:16px;width:min(420px,100%)}
#cam{width:100%;aspect-ratio:3/4;max-height:62vh;object-fit:cover;transform:scaleX(-1);border-radius:22px;background:#000}
.say{color:#EAF6F7;font:600 18px/1.4 var(--f-body);text-align:center;min-height:50px}
.ov-err{color:#FFB4A5;font:600 16px/1.4 var(--f-body);text-align:center}
.overlay .btn{background:#12333B;border-color:#25434B;color:#EAF6F7}

.toast{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  max-width:460px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;z-index:80;font-weight:500}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9"/><path d="M5 17h5l3-7 5 13 3-6h6"/></svg>
      <div><div class="wm">PaisaPulse</div><div class="sub" id="sub"></div></div>
    </div>
    <div class="tools"><span class="role" id="role" hidden></span><button class="lang" id="lang" type="button" data-act="lang" aria-label="Language"></button></div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Sections" hidden></nav>
  <main id="view"></main>
</div>
<div id="sheetRoot"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div id="overlay" class="overlay" hidden>
  <div class="ov-box">
    <video id="cam" playsinline muted autoplay></video>
    <p class="say" id="ov-say"></p>
    <p class="ov-err" id="ov-err" hidden></p>
    <button class="btn" id="ov-close" type="button" data-act="ovclose"></button>
  </div>
</div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
